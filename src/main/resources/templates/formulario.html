<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Película</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-3" th:text="${pelicula.idPelicula == null ? 'Registrar Película' : 'Editar Película'}"></h2>
            
            <form th:action="@{/peliculas/guardar}" th:object="${pelicula}" method="post" class="card p-4 shadow-sm">
                <!-- Campo oculto indispensable para saber si estamos editando un registro existente -->
                <input type="hidden" th:field="*{idPelicula}" />

                <div class="mb-3">
                    <label class="form-label">Nombre de la Película:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Director:</label>
                    <input type="text" th:field="*{director}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Estreno:</label>
                    <input type="date" th:field="*{fechaEstreno}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Género:</label>
                    <select th:field="*{genero.idGenero}" class="form-select" required>
                        <option value="">-- Seleccione un Género --</option>
                        <option th:each="gen : ${generos}" th:value="${gen.idGenero}" th:text="${gen.nombre}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/peliculas}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
