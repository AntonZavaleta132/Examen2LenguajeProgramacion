<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Películas - Sistema de Cine</title>
    <!-- Bootstrap CSS para un diseño limpio y ordenado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <h2 class="mb-3">Sistema de Gestión de Películas</h2>
            <a th:href="@{/peliculas/nuevo}" class="btn btn-primary mb-3">Registrar Nueva Película</a>
            
            <table class="table table-striped table-bordered shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Director</th>
                        <th>Fecha Estreno</th>
                        <th>Género</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pelicula : ${peliculas}">
                        <td th:text="${pelicula.idPelicula}"></td>
                        <td th:text="${pelicula.nombre}"></td>
                        <td th:text="${pelicula.director}"></td>
                        <td th:text="${#dates.format(pelicula.fechaEstreno, 'yyyy-MM-dd')}"></td>
                        <td th:text="${pelicula.genero != null ? pelicula.genero.nombre : 'Sin género'}"></td>
                        <td>
                            <a th:href="@{/peliculas/editar/{id}(id=${pelicula.idPelicula})}" class="btn btn-warning btn-sm">Editar</a>
                            <a th:href="@{/peliculas/eliminar/{id}(id=${pelicula.idPelicula})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar esta película?');">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(peliculas)}">
                        <td colspan="6" class="text-center">No hay películas registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
